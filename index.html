<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Empeños - Con Vencimiento y Extras</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Librerías de Firebase (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        :root { --primary: #2563eb; --bg-main: #f8fafc; --sidebar-bg: #0f172a; --card-bg: #ffffff; --text-main: #0f172a; --text-muted: #64748b; --border: #e2e8f0; --success: #10b981; --danger: #ef4444; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; }
        .sidebar { width: 260px; background-color: var(--sidebar-bg); color: white; padding: 24px; display: flex; flex-direction: column; gap: 32px; position: fixed; height: 100vh; z-index: 100; }
        .brand-icon { width: 40px; height: 40px; background: var(--primary); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; }
        .nav-item { display: flex; align-items: center; padding: 12px 16px; color: #94a3b8; border-radius: 8px; cursor: pointer; border: none; background: transparent; width: 100%; text-align: left; font-size: 14px; margin-bottom: 8px; }
        .nav-item.active { background: #1e293b; color: #fff; border-left: 4px solid var(--primary); }
        .main-wrapper { margin-left: 260px; flex: 1; padding: 32px; max-width: 1250px; }
        header { margin-bottom: 28px; display: flex; justify-content: space-between; align-items: center; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 32px; }
        .metric-card { background: var(--card-bg); padding: 20px 24px; border-radius: 12px; border: 1px solid var(--border); }
        .metric-title { font-size: 13px; color: var(--text-muted); font-weight: 500; margin-bottom: 8px; }
        .metric-value { font-size: 26px; font-weight: 700; }
        .section-panel { display: none; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); padding: 24px; }
        .section-panel.active { display: block; }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full-width { grid-column: span 2; }
        label { font-size: 13px; font-weight: 600; }
        input, select { padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
        .search-input { width: 100%; padding: 12px 16px; font-size: 15px; border-radius: 8px; border: 2px solid var(--primary); margin-bottom: 20px; outline: none; background-color: #f1f5f9; }
        .search-input:focus { background-color: #ffffff; border-color: #1d4ed8; }
        .btn-submit { background: var(--primary); color: white; padding: 12px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; width: 100%; }
        .btn-cancel { background: #64748b; color: white; padding: 12px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; width: 100%; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px 10px; border-bottom: 1px solid var(--border); font-size: 13px; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; }
        .badge-warning { background: #fef3c7; color: #92400e; }
        .badge-danger { background: #fee2e2; color: #991b1b; }
        .badge-success { background: #d1fae5; color: #065f46; }
        .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: 500; margin-right: 2px; }
        .btn-editar { background: #f59e0b; color: white; }
        .btn-eliminar { background: #ef4444; color: white; }
        .btn-extra { background: #10b981; color: white; }
        .img-link { color: var(--primary); text-decoration: none; font-weight: 600; font-size: 12px; cursor: pointer; }
        @media (max-width: 768px) { body { flex-direction: column; } .sidebar { width: 100%; height: auto; position: relative; } .main-wrapper { margin-left: 0; padding: 16px; } .form-grid { grid-template-columns: 1fr; } .form-group.full-width { grid-column: span 1; } }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div style="display:flex; align-items:center; gap:12px;">
            <div class="brand-icon">E</div>
            <div><h2>Control Empeño</h2><p style="font-size:12px; color:#94a3b8">Con Fotos en Nube</p></div>
        </div>
        <nav style="margin-top:20px;">
            <button class="nav-item active" id="nav-dash" onclick="switchTab('dashboard')">Dashboard</button>
            <button class="nav-item" id="nav-nuevo" onclick="switchTab('nuevo')">Nuevo Empeño</button>
            <button class="nav-item" id="nav-clientes" onclick="switchTab('clientes')">Lista de Clientes</button>
        </nav>
    </aside>

    <div class="main-wrapper">
        <header><h1 id="page-title">Resumen General</h1></header>

        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-title">TOTAL EN LA CALLE</div>
                <div class="metric-value" id="total-dinero">RD$ 0</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">TARJETAS EN POSESIÓN</div>
                <div class="metric-value" id="total-tarjetas">0</div>
            </div>
        </div>

        <!-- Dashboard -->
        <div id="section-dashboard" class="section-panel active">
            <h3 style="margin-bottom:16px;">Clientes Activos</h3>
            <div style="overflow-x:auto;">
                <table>
                    <thead>
                        <tr><th>Cliente</th><th>Cédula</th><th>Tarjeta</th><th>Monto Total</th><th>Documentos</th><th>Vencimiento</th></tr>
                    </thead>
                    <tbody id="tabla-resumen"></tbody>
                </table>
            </div>
        </div>

        <!-- Formulario -->
        <div id="section-nuevo" class="section-panel">
            <h3 id="form-header-title" style="margin-bottom:20px;">Registrar Cliente</h3>
            <form id="empeno-form">
                <input type="hidden" id="edit-id" value="">
                <div class="form-grid">
                    <div class="form-group"><label>Nombre Completo *</label><input type="text" id="nombre" required></div>
                    <div class="form-group"><label>Cédula *</label><input type="text" id="cedula" required></div>
                    <div class="form-group"><label>Teléfono *</label><input type="tel" id="telefono" required></div>
                    <div class="form-group">
                        <label>Tipo de Tarjeta *</label>
                        <select id="tipo-tarjeta" required>
                            <option value="Supérate">Supérate</option>
                            <option value="MIO">MIO</option>
                            <option value="Débito Banco">Débito Banco</option>
                            <option value="Otra">Otra</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Monto Prestado Inicial (RD$) *</label><input type="number" id="monto" value="12000" required></div>
                    <div class="form-group"><label>Monto Extra Adicional (RD$)</label><input type="number" id="extras" value="0"></div>
                    
                    <div class="form-group"><label>Fecha Inicio *</label><input type="date" id="fecha-inicio" required></div>
                    <div class="form-group">
                        <label>Tiempo de Empeño *</label>
                        <select id="duracion-anos" required>
                            <option value="1">1 Año</option>
                            <option value="2">2 Años</option>
                            <option value="3">3 Años</option>
                            <option value="5">5 Años</option>
                        </select>
                    </div>

                    <div class="form-group"><label>Foto Cédula</label><input type="file" id="foto-cedula" accept="image/*"></div>
                    <div class="form-group"><label>Foto Tarjeta</label><input type="file" id="foto-tarjeta" accept="image/*"></div>

                    <div class="form-group full-width"><label>Notas</label><input type="text" id="notas"></div>
                    <div class="form-group full-width" style="display:flex; gap:10px;">
                        <button type="submit" class="btn-submit" id="btn-save-form">Guardar de Una Vez</button>
                        <button type="button" class="btn-cancel" id="btn-cancel-edit" style="display:none;" onclick="resetForm()">Cancelar</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Clientes -->
        <div id="section-clientes" class="section-panel">
            <h3 style="margin-bottom:16px;">Directorio Completo</h3>
            
            <input type="text" id="input-buscar" class="search-input" placeholder="🔍 Buscar por nombre, cédula, teléfono o tarjeta..." onkeyup="renderData()">

            <div style="overflow-x:auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Cliente</th>
                            <th>Contacto</th>
                            <th>Tarjeta</th>
                            <th>Monto Total</th>
                            <th>Fotos</th>
                            <th>Acciones</th>
                            <th>Vencimiento</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-clientes"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            authDomain: "sistemaempenostarjetasv2-16ee7.firebaseapp.com",
            databaseURL: "https://sistemaempenostarjetasv2-16ee7-default-rtdb.firebaseio.com",
            projectId: "sistemaempenostarjetasv2-16ee7"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let clientesMap = {};

        document.getElementById('fecha-inicio').valueAsDate = new Date();

        db.ref('clientes').on('value', (snapshot) => {
            clientesMap = snapshot.val() || {};
            renderData();
        });

        function switchTab(tab) {
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.section-panel').forEach(s => s.classList.remove('active'));
            if(tab === 'dashboard') {
                document.getElementById('section-dashboard').classList.add('active');
                document.getElementById('nav-dash').classList.add('active');
            } else if(tab === 'nuevo') {
                document.getElementById('section-nuevo').classList.add('active');
                document.getElementById('nav-nuevo').classList.add('active');
            } else if(tab === 'clientes') {
                document.getElementById('section-clientes').classList.add('active');
                document.getElementById('nav-clientes').classList.add('active');
            }
        }

        function fileToBase64(file) {
            return new Promise((resolve) => {
                if (!file) return resolve('');
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => resolve('');
                reader.readAsDataURL(file);
            });
        }

        document.getElementById('empeno-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btnSave = document.getElementById('btn-save-form');
            btnSave.innerText = "Guardando...";
            btnSave.disabled = true;

            try {
                const editId = document.getElementById('edit-id').value;
                const inicio = new Date(document.getElementById('fecha-inicio').value);
                const anos = parseInt(document.getElementById('duracion-anos').value) || 1;
                
                const vencimiento = new Date(inicio);
                vencimiento.setFullYear(vencimiento.getFullYear() + anos);

                const fileCedula = document.getElementById('foto-cedula').files[0];
                const fileTarjeta = document.getElementById('foto-tarjeta').files[0];

                let urlCedula = editId && clientesMap[editId] ? clientesMap[editId].urlCedula || '' : '';
                let urlTarjeta = editId && clientesMap[editId] ? clientesMap[editId].urlTarjeta || '' : '';

                if (fileCedula) urlCedula = await fileToBase64(fileCedula);
                if (fileTarjeta) urlTarjeta = await fileToBase64(fileTarjeta);

                const payload = {
                    nombre: document.getElementById('nombre').value,
                    cedula: document.getElementById('cedula').value,
                    telefono: document.getElementById('telefono').value,
                    tarjeta: document.getElementById('tipo-tarjeta').value,
                    monto: parseFloat(document.getElementById('monto').value) || 0,
                    extras: parseFloat(document.getElementById('extras').value) || 0,
                    fechaInicio: inicio.toISOString().split('T')[0],
                    duracionAnos: anos,
                    fechaVencimiento: vencimiento.toISOString().split('T')[0],
                    notas: document.getElementById('notas').value,
                    urlCedula: urlCedula,
                    urlTarjeta: urlTarjeta,
                    estado: 'Activo'
                };

                if (editId) {
                    await db.ref('clientes/' + editId).update(payload);
                } else {
                    await db.ref('clientes').push(payload);
                }

                resetForm();
                switchTab('clientes');
            } catch (err) {
                alert("Error guardando datos: " + err.message);
            } finally {
                btnSave.innerText = "Guardar de Una Vez";
                btnSave.disabled = false;
            }
        });

        function agregarExtraRapido(id) {
            const c = clientesMap[id];
            if (!c) return;
            const extraActual = c.extras || 0;
            const nuevoExtraStr = prompt(`Agregar monto extra a ${c.nombre}:\nExtra actual: RD$ ${extraActual.toLocaleString()}\n\n¿Cuánto dinero extra va a retirar?`, "1000");
            
            if (nuevoExtraStr !== null) {
                const adicional = parseFloat(nuevoExtraStr) || 0;
                if (adicional > 0) {
                    const totalExtras = extraActual + adicional;
                    db.ref('clientes/' + id).update({ extras: totalExtras });
                    alert(`¡Se agregaron RD$ ${adicional.toLocaleString()} extras a ${c.nombre}!`);
                }
            }
        }

        function editarCliente(id) {
            const c = clientesMap[id];
            if (!c) return;
            document.getElementById('edit-id').value = id;
            document.getElementById('nombre').value = c.nombre;
            document.getElementById('cedula').value = c.cedula;
            document.getElementById('telefono').value = c.telefono;
            document.getElementById('tipo-tarjeta').value = c.tarjeta;
            document.getElementById('monto').value = c.monto;
            document.getElementById('extras').value = c.extras || 0;
            document.getElementById('fecha-inicio').value = c.fechaInicio;
            document.getElementById('duracion-anos').value = c.duracionAnos || 1;
            document.getElementById('notas').value = c.notas || '';
            document.getElementById('btn-save-form').innerText = "Actualizar Cambios";
            document.getElementById('btn-cancel-edit').style.display = "block";
            switchTab('nuevo');
        }

        function eliminarCliente(id) {
            if (confirm('¿Eliminar definitivamente este registro?')) {
                db.ref('clientes/' + id).remove();
            }
        }

        function resetForm() {
            document.getElementById('edit-id').value = '';
            document.getElementById('empeno-form').reset();
            document.getElementById('fecha-inicio').valueAsDate = new Date();
            document.getElementById('duracion-anos').value = "1";
            document.getElementById('extras').value = "0";
            document.getElementById('btn-save-form').innerText = "Guardar de Una Vez";
            document.getElementById('btn-cancel-edit').style.display = "none";
        }

        function abrirFoto(base64Data) {
            if (!base64Data) return;
            const win = window.open("");
            win.document.write(`<img src="${base64Data}" style="max-width:100%; height:auto;" />`);
        }

        function renderData() {
            const keys = Object.keys(clientesMap);
            const query = (document.getElementById('input-buscar')?.value || '').toLowerCase().trim();
            const hoyStr = new Date().toISOString().split('T')[0];

            let totalDinero = 0;
            let totalTarjetas = 0;

            const tbodyResumen = document.getElementById('tabla-resumen');
            const tbodyClientes = document.getElementById('tabla-clientes');
            tbodyResumen.innerHTML = '';
            tbodyClientes.innerHTML = '';

            keys.forEach(id => {
                const c = clientesMap[id];
                const montoInicial = c.monto || 0;
                const extras = c.extras || 0;
                const montoTotal = montoInicial + extras;

                const linkCedula = c.urlCedula ? `<span onclick="abrirFoto('${c.urlCedula}')" class="img-link">🪪 Cédula</span>` : 'Sin foto';
                const linkTarjeta = c.urlTarjeta ? `<span onclick="abrirFoto('${c.urlTarjeta}')" class="img-link">💳 Tarjeta</span>` : 'Sin foto';

                // Calcular estado de vencimiento
                let badgeVencimiento = `<span class="badge badge-success">${c.fechaVencimiento}</span>`;
                if (c.fechaVencimiento && c.fechaVencimiento < hoyStr) {
                    badgeVencimiento = `<span class="badge badge-danger">Vencido (${c.fechaVencimiento})</span>`;
                }

                const desgloseMonto = extras > 0 
                    ? `RD$ ${montoTotal.toLocaleString()}<br><small style="color:#10b981;">(Base: ${montoInicial} + Extra: ${extras})</small>`
                    : `RD$ ${montoTotal.toLocaleString()}`;

                if (c.estado === 'Activo') {
                    totalDinero += montoTotal;
                    totalTarjetas++;
                    tbodyResumen.innerHTML += `
                        <tr>
                            <td><strong>${c.nombre}</strong></td>
                            <td>${c.cedula}</td>
                            <td><span class="badge badge-warning">${c.tarjeta}</span></td>
                            <td>${desgloseMonto}</td>
                            <td>${linkCedula} | ${linkTarjeta}</td>
                            <td>${badgeVencimiento}</td>
                        </tr>
                    `;
                }

                const matchNombre = c.nombre.toLowerCase().includes(query);
                const matchCedula = c.cedula.toLowerCase().includes(query);
                const matchTelefono = c.telefono.toLowerCase().includes(query);
                const matchTarjeta = c.tarjeta.toLowerCase().includes(query);

                if (query === '' || matchNombre || matchCedula || matchTelefono || matchTarjeta) {
                    tbodyClientes.innerHTML += `
                        <tr>
                            <td><strong>${c.nombre}</strong><br><small>${c.cedula}</small></td>
                            <td>${c.telefono}</td>
                            <td><span class="badge badge-warning">${c.tarjeta}</span></td>
                            <td>${desgloseMonto}</td>
                            <td>${linkCedula}<br>${linkTarjeta}</td>
                            <td>
                                <button class="btn-sm btn-extra" onclick="agregarExtraRapido('${id}')" title="Agregar extra">+ Extra</button>
                                <button class="btn-sm btn-editar" onclick="editarCliente('${id}')">✏️ Editar</button>
                                <button class="btn-sm btn-eliminar" onclick="eliminarCliente('${id}')">🗑️ Eliminar</button>
                            </td>
                            <td>${badgeVencimiento}</td>
                        </tr>
                    `;
                }
            });

            document.getElementById('total-dinero').innerText = `RD$ ${totalDinero.toLocaleString()}`;
            document.getElementById('total-tarjetas').innerText = totalTarjetas;
        }
    </script>
</body>
</html>
